<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Retail Territory Map — Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    body{display:flex;flex-direction:column}.header{display:flex;align-items:center;gap:16px;padding:14px 18px;background:#fff;border-bottom:1px solid #e5e9f0}.title{font-weight:750;font-size:16px}.subtitle{font-size:12px;color:#6b7280}.badge{margin-left:auto;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e9f0;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button{height:34px;border:1px solid #d5dae3;border-radius:8px;background:#fff;padding:0 10px;font:inherit;font-size:12px}.toolbar input{min-width:230px}.toolbar button{cursor:pointer;font-weight:650}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;flex:1;min-height:0}.map{min-height:320px}.panel{background:#fff;border-left:1px solid #e5e9f0;display:flex;flex-direction:column;min-height:0}.panel-head{padding:12px 14px;border-bottom:1px solid #edf0f5;font-size:12px;font-weight:700}.list{overflow:auto}.item{padding:12px 14px;border-bottom:1px solid #f0f2f6;cursor:pointer}.item:hover{background:#f8fafc}.item-title{font-size:13px;font-weight:700}.item-meta{font-size:11px;color:#6b7280;margin-top:3px}.empty{padding:24px 14px;color:#6b7280;font-size:12px}.leaflet-popup-content{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{max-height:38vh;border-left:0;border-top:1px solid #e5e9f0}.toolbar input{min-width:0;flex:1}.badge{display:none}}
  </style>
</head>
<body>
  <header class="header">
    <div>
      <div class="title">Retail Territory Map</div>
      <div class="subtitle">Prototype cartographique — données de démonstration uniquement</div>
    </div>
    <div class="badge">DEMO DATA</div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Rechercher une ville ou un point…" autocomplete="off">
    <select id="type">
      <option value="">Tous les types</option>
      <option value="Hypermarket">Hypermarket</option>
      <option value="Supermarket">Supermarket</option>
      <option value="Convenience">Convenience</option>
    </select>
    <button id="reset" type="button">Réinitialiser</button>
    <button id="export" type="button">Exporter CSV</button>
  </div>

  <main class="layout">
    <div id="map" class="map"></div>
    <aside class="panel">
      <div class="panel-head"><span id="count">0</span> point(s)</div>
      <div id="list" class="list"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Synthetic records only. Never commit client, employee, territory or prospect data here.
    const DATA = [
      { id: 1, name: 'Demo Point Marseille', city: 'Marseille', postalCode: '13000', type: 'Hypermarket', status: 'À visiter', lat: 43.2965, lon: 5.3698 },
      { id: 2, name: 'Demo Point Lyon', city: 'Lyon', postalCode: '69000', type: 'Supermarket', status: 'Planifié', lat: 45.7640, lon: 4.8357 },
      { id: 3, name: 'Demo Point Bordeaux', city: 'Bordeaux', postalCode: '33000', type: 'Convenience', status: 'À visiter', lat: 44.8378, lon: -0.5792 },
      { id: 4, name: 'Demo Point Lille', city: 'Lille', postalCode: '59000', type: 'Supermarket', status: 'Terminé', lat: 50.6292, lon: 3.0573 }
    ];

    const map = L.map('map', { scrollWheelZoom: true }).setView([46.5, 2.5], 5.4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = new Map();
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    const type = document.getElementById('type');

    function matches(point) {
      const q = search.value.trim().toLowerCase();
      const typeOk = !type.value || point.type === type.value;
      const text = [point.name, point.city, point.postalCode, point.type, point.status].join(' ').toLowerCase();
      return typeOk && (!q || text.includes(q));
    }

    function popup(point) {
      return `<strong>${escapeHtml(point.name)}</strong><br>${escapeHtml(point.city)} (${escapeHtml(point.postalCode)})<br><small>${escapeHtml(point.type)} · ${escapeHtml(point.status)}</small>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function render() {
      const visible = DATA.filter(matches);
      list.innerHTML = '';
      markers.forEach(marker => map.removeLayer(marker));
      markers.clear();

      visible.forEach(point => {
        const marker = L.marker([point.lat, point.lon]).addTo(map).bindPopup(popup(point));
        markers.set(point.id, marker);

        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<div class="item-title">${escapeHtml(point.name)}</div><div class="item-meta">${escapeHtml(point.city)} · ${escapeHtml(point.type)} · ${escapeHtml(point.status)}</div>`;
        item.addEventListener('click', () => {
          map.setView([point.lat, point.lon], Math.max(map.getZoom(), 9));
          marker.openPopup();
        });
        list.appendChild(item);
      });

      if (!visible.length) list.innerHTML = '<div class="empty">Aucun point ne correspond aux filtres.</div>';
      count.textContent = visible.length;
    }

    function exportCsv() {
      const rows = DATA.filter(matches);
      const columns = ['name','city','postalCode','type','status','lat','lon'];
      const csv = [columns.join(','), ...rows.map(row => columns.map(key => `"${String(row[key]).replace(/"/g,'""')}"`).join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'retail-territory-demo.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    search.addEventListener('input', render);
    type.addEventListener('change', render);
    document.getElementById('reset').addEventListener('click', () => { search.value = ''; type.value = ''; render(); });
    document.getElementById('export').addEventListener('click', exportCsv);

    render();
  </script>
</body>
</html>
