function fmtMin(m){if(!m&&m!==0)return'0 min';var t=Math.round(m);var h=Math.floor(t/60),mn=t%60;return h>0?(mn?h+'h'+String(mn).padStart(2,'0'):h+'h'):t+' min';}
function icon(color,label,isVip){
  var hasL=label!=null&&label!='';var sz=hasL?26:20;
  var border=isVip?'2.5px solid #9c27b0':'2.5px solid rgba(255,255,255,.85)';
  var vipBadge=isVip?'<span style="position:absolute;top:-3px;right:-3px;background:#9c27b0;color:#fff;font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px;border:1px solid #fff">VIP</span>':'';
  var inner='<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+color+';border:'+border+';box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">'+(hasL?label:'')+'</div>';
  var html=isVip?'<div style="position:relative;display:inline-block">'+inner+vipBadge+'</div>':inner;
  var ws=isVip?sz+8:sz;
  return L.divIcon({html:html,className:'',iconSize:[ws,ws],iconAnchor:[ws/2,ws/2],popupAnchor:[0,-(ws/2+3)]});
}
function splitIcon(colors,label,isVip){
  var hasL=label!=null&&label!='';var sz=hasL?26:20;
  var n=colors.length;
  var border=isVip?'2.5px solid #9c27b0':'2.5px solid rgba(255,255,255,.9)';
  var stripes='';
  for(var i=0;i<n;i++){
    var pct=(100/n).toFixed(2);
    stripes+='<div style="position:absolute;top:0;left:'+(i*100/n).toFixed(2)+'%;width:'+pct+'%;height:100%;background:'+colors[i]+'"></div>';
  }
  var lbl=hasL?'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:1">'+label+'</div>':'';
  var vipBadge=isVip?'<span style="position:absolute;top:-3px;right:-3px;background:#9c27b0;color:#fff;font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px;border:1px solid #fff;z-index:2">VIP</span>':'';
  var circ='<div style="position:relative;width:'+sz+'px;height:'+sz+'px;border-radius:50%;overflow:hidden;border:'+border+';box-shadow:0 2px 8px rgba(0,0,0,.35)">'+stripes+lbl+'</div>';
  var html=isVip?'<div style="position:relative;display:inline-block">'+circ+vipBadge+'</div>':circ;
  var ws=isVip?sz+8:sz;
  return L.divIcon({html:html,className:'',iconSize:[ws,ws],iconAnchor:[ws/2,ws/2],popupAnchor:[0,-(ws/2+3)]});
}
var GROUPS={};
DATA.forEach(function(p){
  if(p.lat==null||p.lon==null)return;
  var key=p.postalCode||p.lat.toFixed(2)+','+p.lon.toFixed(2);
  if(!GROUPS[key])GROUPS[key]={lat:p.lat,lon:p.lon,items:[]};
  GROUPS[key].items.push(p);
});
Object.keys(GROUPS).forEach(function(key){
  var g=GROUPS[key];var items=g.items;
  var total=items.reduce(function(s,p){return s+(p.nbreProspects||1);},0);
  var label=items.length>1?total:(items[0].nbreProspects>1?items[0].nbreProspects:null);
  var isV=items.some(function(p){return p._isVip;});
  var cid=items.length>1?('c'+(_ci++)):null;
  if(cid)CLUSTER_DATA[cid]=items;
  var distinctCols=[...new Set(items.map(function(p){return getCol(p);}))];
  var isMixed=items.length>1&&distinctCols.length>1;
  var ico=isMixed?splitIcon(distinctCols,label,isV):icon(getCol(items[0]),label,isV);
  var m=L.marker([g.lat,g.lon],{icon:ico}).bindPopup(buildPopup(items,cid),{maxWidth:330}).addTo(map);
  items.forEach(function(p){MK[p.id]=m;});GRP_MK[key]=m;
});
function renderClusterItems(items){
  var h='';
  items.forEach(function(p){
    h+='<div style="padding:6px 0;border-bottom:1px solid #f5f5f5">'
      +'<div style="display:flex;align-items:flex-start;gap:7px">'
        +'<div style="width:9px;height:9px;border-radius:50%;background:'+p._color+';flex-shrink:0;margin-top:3px"></div>'
        +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px">'+(p.brand||'—')
            +(p._isVip?'<span style="background:#9c27b0;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:99px">★ VIP</span>':'')
          +'</div>'
          +(p.storeName?'<div style="color:#666;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.storeName+'</div>':'')
          +(p.surface?'<div style="color:#999;font-size:10px">&#x1F4D0; '+p.surface+' m²</div>':'')
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0">'
          +'<span style="background:'+p._color+';color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:700;display:block">'+p._profileName+'</span>'
          +(p._distStr?'<span style="font-size:10px;color:#666;display:block;margin-top:2px">'+p._distStr+'</span>':'')
        +'</div>'
      +'</div>'
    +'</div>';
  });
  return h;
}
function sortCluster(cid,by){
  var items=CLUSTER_DATA[cid];if(!items)return;
  var sorted=items.slice();
  if(by==='dist')sorted.sort(function(a,b){return(a._dist!=null?a._dist:9e9)-(b._dist!=null?b._dist:9e9);});
  if(by==='vip') sorted.sort(function(a,b){return(b._isVip?1:0)-(a._isVip?1:0);});
  var el=document.getElementById('cl-'+cid);if(el)el.innerHTML=renderClusterItems(sorted);
  var ss='background:#1565c0;border-color:#1565c0;color:#fff';
  var su='background:#263238;border-color:#455a64;color:#b0bec5';
  ['dist','vip'].forEach(function(s){var b=document.getElementById('sb-'+s+'-'+cid);if(b)b.style.cssText=s===by?ss:su;});
}
function buildPopup(items,cid){
  var bs='background:#263238;border:1px solid #455a64;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;color:#b0bec5;cursor:pointer';
  if(items.length===1){var p=items[0];return '<div style="font-family:system-ui;font-size:13px;line-height:1.5"><b style="font-size:14px">'+(p.brand||'—')+'</b>'+(p._isVip?'<span style="display:inline-flex;align-items:center;background:#9c27b0;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:middle">★ VIP</span>':'')+(p.storeName?'<div>'+p.storeName+'</div>':'')+(p.surface?'<div style="color:#666;font-size:11px">&#x1F4D0; '+p.surface+' m²'+(p.format?' &middot; '+p.format:'')+'</div>':p.format?'<div style="color:#888;font-size:11px">'+p.format+'</div>':'')+'<div style="color:#666">&#x1F4CD; '+(p.city||'')+(p.postalCode?' ('+p.postalCode+')':'')+'</div><div style="margin-top:5px"><span style="background:'+p._color+';color:#fff;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700">'+p._profileName+'</span> '+(p._distStr?'<span style="color:#666;font-size:11px">'+p._distStr+'</span>':'')+'</div>'+(p.notes?'<hr style="margin:5px 0;border:none;border-top:1px solid #eee"><div style="color:#666;font-size:11px">'+p.notes+'</div>':'')+'</div>';}
  var city=items[0].city||items[0].postalCode;
  var total=items.reduce(function(s,p){return s+(p.nbreProspects||1);},0);
  return '<div style="font-family:system-ui;font-size:13px;min-width:290px">'
    +'<div style="display:flex;align-items:center;gap:5px;padding:4px 0 8px;border-bottom:2px solid #eee">'
      +'<b style="flex:1;font-size:13px">'+city+' — '+total+' prospect'+(total>1?'s':'')+'</b>'
    +'</div>'
    +'<div id="cl-'+cid+'" style="max-height:350px;overflow-y:auto">'
      +renderClusterItems(items)
    +'</div>'
  +'</div>';
}
function isVis(p){
  if(SHOW_PROFILE_FILTER&&!showP[p._profileId])return false;
  var q=(document.getElementById('f-search').value||'').toLowerCase();
  if(q){var f=[p.brand,p.storeName,p.city,p.postalCode,p.format,dept(p)];if(!f.some(function(v){return v&&v.toLowerCase().includes(q);}))return false;}
  var bc=Array.from(document.querySelectorAll('.cb-brand:checked')).map(function(x){return x.value;});
  if(bc.length&&!bc.includes(p.brand))return false;
  var dc=Array.from(document.querySelectorAll('.cb-dept:checked')).map(function(x){return x.value;});
  if(dc.length&&!dc.includes(dept(p)))return false;
  var fc=Array.from(document.querySelectorAll('.cb-format:checked')).map(function(x){return x.value;});
  if(fc.length&&!fc.includes(p.format))return false;
  if(vipMode==='vip'&&!p._isVip)return false;
  if(vipMode==='novip'&&p._isVip)return false;
  return true;
}
function buildList(){
  var body=document.getElementById('list-body');body.innerHTML='';
  DATA.forEach(function(p){
    var vis=isVis(p);var div=document.createElement('div');
    div.className='item'+(vis?'':' hidden');div.dataset.id=p.id;
    var col=getCol(p);
    div.style.borderLeftColor=p._color;div.style.background=p._color+'11';
    div.innerHTML='<div class="dot" style="background:'+col+'"></div><div class="iinfo"><div class="ibrand">'+(p.brand||'—')+(p._isVip?'<span class="vip-badge">★ VIP</span>':'')+'</div>'+(p.storeName?'<div class="istore">'+p.storeName+'</div>':'')+'<div class="iloc">&#x1F4CD; '+(p.city||'')+(p.postalCode?' ('+p.postalCode+')':'')+' D'+dept(p)+'</div></div><div class="zpill" style="background:'+p._color+'">'+p._profileName+(p._distStr?'<br><span style="font-size:9px;opacity:.85">'+p._distStr+'</span>':'')+'</div>';
    (function(id){div.addEventListener('click',function(){var pp=DATA.find(function(x){return x.id===id;});if(pp&&pp.lat!=null){map.setView([pp.lat,pp.lon],14);var m=MK[id];if(m)m.openPopup();}});})(p.id);
    body.appendChild(div);
  });updStats();
}
function updStats(){
  var counts={};document.querySelectorAll('.item:not(.hidden)').forEach(function(el){var p=DATA.find(function(x){return x.id===el.dataset.id;});if(!p)return;counts[p._profileId]=(counts[p._profileId]||0)+1;});
  var total=Object.values(counts).reduce(function(s,v){return s+v;},0);
  var hdr=document.getElementById('hdr-stats');hdr.innerHTML='';
  var sp=document.createElement('span');sp.className='stat-pill';sp.style.background='rgba(255,255,255,.15)';sp.textContent=total+' prospect'+(total!==1?'s':'');hdr.appendChild(sp);
  PROFILES.forEach(function(p){var c=counts[p.id]||0;if(!c)return;var sp=document.createElement('span');sp.className='stat-pill';sp.style.background=p.color+'99';sp.textContent=c+' '+p.name;hdr.appendChild(sp);});
  document.getElementById('f-cnt').textContent=total+' / '+DATA.length;
}
function applyF(){
  document.querySelectorAll('.item').forEach(function(el){var p=DATA.find(function(x){return x.id===el.dataset.id;});if(!p)return;el.classList.toggle('hidden',!isVis(p));});
  refreshMarkerColors();
  updStats();updCnts();
}
function refreshMarkerColors(){
  Object.keys(GROUPS).forEach(function(key){
    var g=GROUPS[key];var m=GRP_MK[key];if(!m)return;
    var items=g.items.filter(function(p){return isVis(p);});
    if(!items.length){map.removeLayer(m);return;}
    var total=items.reduce(function(s,p){return s+(p.nbreProspects||1);},0);
    var label=items.length>1?total:(items[0].nbreProspects>1?items[0].nbreProspects:null);
    var col=getCol(items[0]);var isV=items.length===1&&items[0]._isVip;
    m.setIcon(icon(col,label,isV));
    if(!map.hasLayer(m))m.addTo(map);
  });
}
function setColorMode(mode){
  colorMode=mode;
  document.getElementById('cm-zone').classList.toggle('on',mode==='zone');
  document.getElementById('cm-heat').classList.toggle('on',mode==='heat');
  var hl=document.getElementById('heat-legend');if(hl)hl.style.display=mode==='heat'?'flex':'none';
  refreshMarkerColors();buildList();
}
function togProfile(id,btn){
  showP[id]=!showP[id];var prof=PROFILES.find(function(p){return p.id===id;});var color=prof?prof.color:'#9e9e9e';
  btn.style.background=showP[id]?color:'transparent';btn.style.color=showP[id]?'#fff':color;btn.style.borderColor=color;btn.classList.toggle('on',showP[id]);applyF();
}
function togDd(n){var b=document.getElementById('body-'+n);var wasOpen=b.classList.contains('open');document.querySelectorAll('.dd-body').forEach(function(e){e.classList.remove('open');});if(!wasOpen)b.classList.add('open');}
function clrDd(n){document.querySelectorAll('.cb-'+n).forEach(function(c){c.checked=false;});applyF();}
function updCnts(){['brand','dept','format'].forEach(function(n){var cnt=document.getElementById('cnt-'+n);if(!cnt)return;var c=document.querySelectorAll('.cb-'+n+':checked').length;cnt.textContent=c||'';cnt.style.display=c?'inline':'none';});}
document.addEventListener('click',function(e){if(!e.target.closest('.dd'))document.querySelectorAll('.dd-body').forEach(function(e){e.classList.remove('open');});});
function togVip(v){vipMode=v;['all','vip','novip'].forEach(function(m){var b=document.getElementById('pvip-'+m);if(b){b.style.background=m===v?'#9c27b0':'transparent';b.style.color=m===v?'#fff':'#b0bec5';}});applyF();}
function togUseKm(){useKm=!useKm;var b=document.getElementById('p-km');if(b){b.style.background=useKm?'#607d8b':'transparent';b.style.color=useKm?'#fff':'#b0bec5';}buildList();}
function fmtDyn(p){if(!useKm){var prof=PROFILES.find(function(x){return x.id===p._profileId;});if(prof&&prof.mode==='min')return fmtMin(p._dist||0);}return p._distStr||'';}
function resetAll(){Object.keys(showP).forEach(function(k){showP[k]=true;});document.getElementById('f-search').value='';document.querySelectorAll('.cb-brand,.cb-dept,.cb-format').forEach(function(c){c.checked=false;});Object.keys(GRP_MK).forEach(function(k){if(!map.hasLayer(GRP_MK[k]))GRP_MK[k].addTo(map);});document.querySelectorAll('.item').forEach(function(e){e.classList.remove('hidden');});document.querySelectorAll('.fpill').forEach(function(btn){if(btn.id&&btn.id.startsWith('pvip-'))return;var rawId=btn.id.replace('pp-','');var prof=PROFILES.find(function(p){return(p.id||'').replace(/[^a-z0-9]/gi,'_')===rawId;});var color=prof?prof.color:'#9e9e9e';btn.style.background=color;btn.style.color='#fff';btn.style.borderColor=color;btn.classList.add('on');});togVip('all');updStats();updCnts();}
function visibleRows(){return DATA.filter(function(p){return isVis(p);}).map(function(p){return{Responsable:p._profileName,Distance:p._distStr||'',Enseigne:p.brand||'',Format:p.format||'',Magasin:p.storeName||'','Code postal':p.postalCode||'',Ville:p.city||'','Département':dept(p),Notes:p.notes||''};});}
function dlCSV(){var rows=visibleRows();if(!rows.length)return;var keys=Object.keys(rows[0]);var csv=[keys.join(',')].concat(rows.map(function(r){return keys.map(function(k){return'"'+String(r[k]).replace(/"/g,'""')+'"';}).join(',');})).join('\n');var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zone_custom_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);}
function dlXLSX(){var rows=visibleRows();if(!rows.length)return;var ws=XLSX.utils.json_to_sheet(rows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Zone Custom');XLSX.writeFile(wb,'zone_custom_'+new Date().toISOString().slice(0,10)+'.xlsx');}
buildList();
togVip('all');
document.querySelectorAll('.fpill').forEach(function(btn){if(btn.id&&btn.id.startsWith('pvip-'))return;var rawId=btn.id.replace('pp-','');var prof=PROFILES.find(function(p){return(p.id||'').replace(/[^a-z0-9]/gi,'_')===rawId;});var color=prof?prof.color:'#9e9e9e';btn.style.background=color;btn.style.color='#fff';btn.style.borderColor=color;btn.classList.add('on');});
</script></body></html>
